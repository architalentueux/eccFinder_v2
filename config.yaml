#----------------------Configuration for eccfinder You can MODIFY these parameters as you want :)---------
args:
 #  option for launch ont longreads analysis
 - "map-ont"
 #  where you locate your fastqfiles

 -  "./data/data.fastq"

 - "-r"

 # where you locate your reference genome
 - "./data/genome.fa"

 # option for including an annotation GFF (plant or human)
 - "-gff"

 - "./data/annotation.gff"

 # option for an additional hg38 GFF (human only)
 - "-te1"

 - "./data/hg38_te1.gff"
 # option for an additional hg38 GFF (human only)
 - "-te2"

 - "./data/hg38_te2.gff"

#----------------------Criteria Human(human) or Plants(plant)-----------------------------
 - "-org"
# put the name of the organism human or plant
 - "plant"
#----------------------config for Tandem Repeat Criteria----------------------------------
 - "-n"
#-----minimum copy number of tandem repeat in a long read (>=2) [2]-----------------------
 - "2"
#-----------------------------------------------------------------------------------------
 - "-e"
#------------------maximum allowed divergence rate between two consecutive repeats--------
 - "0.25"
#-----------------------------------------------------------------------------------------
 - "-s"
#---minimum period size of tandem repeat (>=2) [30]---------------------------------------
 - "30"
#----------------------end config tandem repeat-------------------------------------------

#----------------------Config for region of peak probably circle--------------------------
# - "-yv"
 - "-l"
#---Minimum length of a peak--------------------------------------------------------------
 - "200"
#-----------------------------------------------------------------------------------------
 - "-d"
#---Maximum distance between signif. sites (def. 100)-------------------------------------
 - "100"
#-----------------------------------------------------------------------------------------
 - "-p"
#--------Maximum p-value (def. 0.01)------------------------------------------------------
 - "0.05"

#-------------------end of Gene enrichment------------------------------------------------

#------------------Config for filtering region--------------------------------------------

 - "--min-read"
#------------------filter locus by unique mapped read number------------------------------
 - "1"
#-----------------------------------------------------------------------------------------

 - "--min-bound"
#------filter locus at regions by boundary coverage---------------------------------------
 - "0.1"
#-----------------------------------------------------------------------------------------
 - "--min-cov"
#---------------------minimum coverage of detected eccDNA loci----------------------------
 - "1"
#-----------------end filtering locus regions---------------------------------------------
 - "-o"

# - "OUTPUT VALUE"
 - "output"
#------------------------------END Configuration------------------------------------------


